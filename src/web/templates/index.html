<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#212121">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Software Lifeform</title>
  <style>
    :root {
      --bg: #212121;
      --bg-elevated: #2f2f2f;
      --bg-hover: #2a2a2a;
      --bubble-user: #303030;
      --border: #3a3a3a;
      --border-strong: #4a4a4a;
      --text: #ececec;
      --text-secondary: #b4b4b4;
      --text-muted: #8e8e8e;
      --accent: #ffffff;
      --accent-text: #0d0d0d;
      --danger: #f06969;
      --danger-bg: rgba(240, 105, 105, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1.25rem 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      z-index: 1;
      max-width: 48rem;
      width: 100%;
      margin: 0 auto;
    }

    .msg {
      max-width: min(85%, 42rem);
      padding: 0.75rem 1rem;
      border-radius: 1.25rem;
      font-size: 0.9375rem;
      line-height: 1.6;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--bubble-user);
      border: none;
      color: var(--text);
    }

    .msg.agent {
      align-self: stretch;
      max-width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding-left: 0;
      padding-right: 0;
    }
    .msg.agent p { margin: 0.5rem 0; }
    .msg.agent p:first-child { margin-top: 0; }
    .msg.agent p:last-child { margin-bottom: 0; }
    .msg.agent a { color: #7eb6ff; }

    .narration {
      align-self: stretch;
      max-width: 100%;
      padding: 0.4rem 0;
      border-radius: 0;
      font-size: 0.8125rem;
      line-height: 1.5;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
    }
    .narration .line {
      display: block;
      animation: fadeUp 0.25s ease;
    }

    .msg table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.875rem;
      margin: 0.5rem 0;
    }
    .msg th, .msg td {
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      text-align: left;
    }
    .msg th { background: var(--bg-elevated); font-weight: 600; }
    .msg tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
    .msg h1, .msg h2, .msg h3 { margin: 0.75rem 0 0.25rem; font-weight: 600; }
    .msg ul, .msg ol { margin: 0.5rem 0; padding-left: 1.5rem; }
    .msg code {
      font-size: 0.875em;
      background: var(--bg-elevated);
      padding: 0.1em 0.35em;
      border-radius: 4px;
      color: #f0c674;
    }
    .msg pre {
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      font-size: 0.8125rem;
    }
    .msg pre code { background: transparent; color: var(--text); padding: 0; }

    .chat-bar {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      padding: 0.5rem 1rem 1rem;
      padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
      background: var(--bg);
    }

    .composer-inner {
      max-width: 48rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      background: var(--bg-elevated);
      border: 1px solid var(--bg-elevated);
      border-radius: 1.5rem;
      padding: 0.35rem 0.35rem 0.35rem 1rem;
      max-width: 48rem;
      margin: 0 auto;
    }
    .input-row:focus-within {
      border-color: var(--border-strong);
    }

    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0.65rem 0.25rem;
      min-height: 44px;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
    }
    .input-row input:focus { outline: none; }
    .input-row input::placeholder { color: var(--text-muted); }

    .btn {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      min-height: 40px;
      min-width: 40px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s, color 0.15s;
    }
    .btn-send {
      background: var(--accent);
      color: var(--accent-text);
    }
    .btn-send:hover:not(:disabled) { background: #d9d9d9; }
    .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

    .voice-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
      max-width: 48rem;
      margin: 0 auto;
      width: 100%;
    }

    .btn-record {
      background: var(--bg-elevated);
      color: var(--danger);
      border: 1px solid var(--border);
    }
    .btn-record:hover { background: var(--bg-hover); }
    .btn-record.recording {
      background: var(--danger-bg);
      border-color: var(--danger);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .btn-stop {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-stop:hover { background: var(--bg-hover); }

    .status {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 0.25rem;
    }

    .toggles {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      margin-top: 0.35rem;
      max-width: 48rem;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
    }
    .toggles-break { display: none; }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .toggle {
      width: 36px;
      height: 20px;
      background: #4a4a4a;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .toggle.on::after { background: #0d0d0d; transform: translateX(16px); }

    .tools-toggle, .memory-toggle, .metrics-toggle {
      padding: 0.35rem 0.6rem;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      font-size: 0.8125rem;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 8px;
      text-decoration: none;
    }
    .tools-toggle:hover, .memory-toggle:hover, .metrics-toggle:hover {
      background: var(--bg-elevated);
      color: var(--text);
    }

    .tools-panel, .metrics-panel {
      display: none;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin: 0 auto 0.5rem;
      max-width: 48rem;
      width: calc(100% - 2rem);
      max-height: 280px;
      overflow-y: auto;
      z-index: 3;
    }
    .tools-panel.open, .metrics-panel.open { display: block; }

    .tools-panel h4, .metrics-panel h4 {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-weight: 600;
      margin: 0.75rem 0 0.5rem;
    }
    .tools-panel h4:first-child, .metrics-panel h4:first-child { margin-top: 0; }
    .tools-panel .tool-item {
      font-size: 0.8125rem;
      padding: 0.5rem 0.6rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      color: var(--text);
    }
    .tools-panel .tool-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .tools-panel .tool-btns { display: flex; gap: 0.3rem; }
    .tools-panel .tool-btns button {
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    .tools-panel .tool-btns button:hover { background: var(--bg-hover); }
    .tools-panel .tool-btns button.reject { border-color: var(--danger); color: var(--danger); }
    .tools-panel .reload-btn {
      margin-top: 0.5rem;
      margin-right: 0.35rem;
      font-size: 0.75rem;
      padding: 0.4rem 0.7rem;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
    }
    .tools-panel .reload-btn:hover { background: var(--bg-hover); }

    .metric-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .metric-row label { min-width: 100px; font-size: 0.8125rem; color: var(--text-secondary); }
    .metric-bar-wrap {
      flex: 1;
      height: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      overflow: hidden;
    }
    .metric-bar {
      height: 100%;
      border-radius: 6px;
      background: var(--text);
      transition: width 0.3s ease;
    }
    .metric-bar.high { background: var(--danger); }
    .metric-value { font-size: 0.75rem; color: var(--text-muted); min-width: 3rem; }

    .settings-gear {
      width: 36px;
      height: 36px;
      padding: 0.45rem;
      cursor: pointer;
      color: var(--text-secondary);
      border-radius: 8px;
    }
    .settings-gear:hover { background: var(--bg-elevated); color: var(--text); }

    .settings-modal {
      display: none;
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: min(28rem, calc(100vw - 2rem));
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      flex-direction: column;
      padding: 1.25rem;
      z-index: 200;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .settings-modal.open { display: flex; }
    .settings-modal h4 { color: var(--text); font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
    .settings-modal label { font-size: 0.8125rem; color: var(--text-secondary); display: block; margin-bottom: 0.25rem; }
    .settings-modal select {
      width: 100%;
      padding: 0.55rem 0.65rem;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.875rem;
    }
    .settings-modal .settings-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.85rem;
    }
    .settings-modal .btn-save-settings {
      padding: 0.5rem 1rem;
      background: var(--accent);
      border: none;
      color: var(--accent-text);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .settings-modal .btn-save-settings:hover { background: #d9d9d9; }
    .settings-modal .settings-feedback { font-size: 0.8125rem; color: #6fcf97; }
    .settings-modal .close-btn {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      min-height: 40px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
    }
    .settings-modal .close-btn:hover { background: var(--bg-hover); }

    .memory-panel {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      flex-direction: column;
    }
    .memory-panel.open { display: flex; }
    .memory-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      padding-top: max(0.75rem, env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .memory-panel-header h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }
    .memory-panel-close {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.875rem;
    }
    .memory-panel-close:hover { background: var(--bg-hover); }
    #memoryGraphContainer {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 1rem;
      overflow-y: auto;
    }
    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.5rem 0;
    }
    .tag-cloud .cloud-tag {
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }
    .tag-cloud .cloud-tag:hover {
      transform: translateY(-1px);
      background: var(--bg-hover);
      color: var(--text);
    }
    .cloud-section { margin-bottom: 1.25rem; }
    .cloud-section h5 {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .memory-node-modal {
      display: none;
      position: fixed;
      inset: 15%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      z-index: 101;
      overflow: hidden;
      flex-direction: column;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .memory-node-modal.open { display: flex; }
    .memory-node-modal h4 {
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }
    .memory-node-modal .content {
      flex: 1;
      overflow-y: auto;
      color: var(--text);
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .memory-node-modal .close-btn {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      min-height: 40px;
      background: var(--accent);
      border: none;
      color: var(--accent-text);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      align-self: flex-start;
    }
    .notifications-toast {
      position: fixed;
      top: max(0.75rem, env(safe-area-inset-top));
      right: 0.75rem;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: min(340px, calc(100vw - 1.5rem));
    }
    .notifications-toast .toast {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 0.875rem;
      line-height: 1.5;
      animation: fadeUp 0.3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .notifications-toast .toast.discord { border-left: 3px solid #5865f2; }
    .notifications-toast .toast.proactive { border-left: 3px solid #6fcf97; }
    .notifications-toast .toast .toast-title { color: var(--text); font-weight: 600; margin-bottom: 0.25rem; }
    .notifications-toast .toast .toast-body { color: var(--text-secondary); }

    /* Subtle scrollbar */
    .messages::-webkit-scrollbar,
    #memoryGraphContainer::-webkit-scrollbar,
    .tools-panel::-webkit-scrollbar,
    .metrics-panel::-webkit-scrollbar {
      width: 8px;
    }
    .messages::-webkit-scrollbar-thumb,
    #memoryGraphContainer::-webkit-scrollbar-thumb,
    .tools-panel::-webkit-scrollbar-thumb,
    .metrics-panel::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
    }
    .messages::-webkit-scrollbar-thumb:hover,
    #memoryGraphContainer::-webkit-scrollbar-thumb:hover,
    .tools-panel::-webkit-scrollbar-thumb:hover,
    .metrics-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.16);
    }

    @media (max-width: 600px) {
      .chat-bar { padding: 0.5rem 0.75rem max(0.75rem, env(safe-area-inset-bottom)); }
      .msg.user { max-width: 92%; font-size: 0.875rem; }
      .memory-panel-header { padding: 0.5rem 0.75rem; }
      .memory-node-modal { inset: 6%; padding: 1rem; }
    }

    /* Adam-style profile fact panel */
    .profile-fact-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .profile-fact {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem 0.75rem;
      padding: 0.6rem 0.75rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      font-size: 0.825rem;
    }
    .profile-fact .fact-value { color: var(--text-primary); font-weight: 500; }
    .profile-fact .fact-meta {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.7rem;
    }
    .profile-fact .health {
      display: inline-block;
      width: 100px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
      vertical-align: middle;
    }
    .profile-fact .health > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #6cf, #6c6);
      transition: width 0.3s ease;
    }
    .profile-fact .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
    }
    .profile-fact .badge.user { background: #2c5; color: #001; }
    .profile-fact .badge.consolidated { background: #59f; color: #001; }
    .profile-fact .badge.imported { background: #a7f; color: #001; }
    .profile-fact .badge.protected { background: #fc4; color: #200; }
    .profile-fact .fact-actions { display: flex; gap: 0.25rem; align-items: flex-start; }
    .profile-fact button {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text-secondary);
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
    }
    .profile-fact button:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    .profile-fact button.danger:hover { background: #732; color: #fff; border-color: #c44; }

    .memory-admin {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
    }
    .memory-admin .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .memory-admin label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
    .memory-admin input, .memory-admin select {
      background: rgba(0,0,0,0.3);
      color: var(--text-primary);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
    }
    .memory-admin button {
      background: rgba(108,255,200,0.15);
      color: #cfe;
      border: 1px solid rgba(108,255,200,0.4);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .memory-admin button:hover { background: rgba(108,255,200,0.3); }
    .memory-admin .full { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div class="notifications-toast" id="notificationsToast"></div>
  <div class="app">
    <div class="messages" id="messages"></div>

    <div class="metrics-panel" id="metricsPanel">
      <h4>Internal metrics</h4>
      <div id="metricsContent"></div>
    </div>
    <div class="memory-panel" id="memoryPanel">
      <div class="memory-panel-header">
        <h3>Memory & knowledge</h3>
        <button class="memory-panel-close" id="memoryPanelClose">Close</button>
      </div>
      <div id="memoryGraphContainer" class="memory-clouds"></div>
    </div>
    <div class="memory-node-modal" id="memoryNodeModal">

      <button class="reload-btn" id="btnImplementTools" style="margin-left:0.5rem">Implement approved tools</button>
    </div>

    <div class="chat-bar">
      <div class="composer-inner">
        <div class="input-row">
          <input type="text" id="textInput" placeholder="Message..." autocomplete="off" />

            <span>Listen</span>

          <span class="memory-toggle" id="memoryToggle">Memory</span>
          <svg class="settings-gear" id="settingsGear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </div>

    <div class="settings-modal" id="settingsModal">
      <h4>Settings</h4>
      <label for="voiceSelect">Voice (TTS)</label>
      <select id="voiceSelect">
        <option value="">Loading...</option>
      </select>
      <div class="settings-actions">
        <button class="btn-save-settings" id="btnSaveSettings">Save</button>
        <span class="settings-feedback" id="settingsFeedback"></span>
      </div>
      <button class="close-btn" id="settingsModalClose" style="margin-top:1rem">Close</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const messages = document.getElementById('messages');
    const btnRecord = document.getElementById('btnRecord');
    const btnStop = document.getElementById('btnStop');
    const btnSend = document.getElementById('btnSend');
    const status = document.getElementById('status');
    const textInput = document.getElementById('textInput');
    const btnTypeSend = document.getElementById('btnTypeSend');
    const toggleTTS = document.getElementById('toggleTTS');
    const toggleListen = document.getElementById('toggleListen');

    let mediaRecorder = null;
    let audioChunks = [];
    let speakResponses = true;
    let listening = true;

    toggleTTS.addEventListener('click', () => {
      speakResponses = !speakResponses;
      toggleTTS.classList.toggle('on', speakResponses);
    });
    toggleListen.addEventListener('click', () => {
      listening = !listening;
      toggleListen.classList.toggle('on', listening);
    });

    function addToLog(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      if (role === 'agent' && typeof marked !== 'undefined') {
        div.innerHTML = marked.parse(text || '');
      } else {
        div.textContent = (role === 'user' ? 'You: ' : '') + text;
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function setStatus(s) { status.textContent = s; }
    function setLoading(loading) {
      btnTypeSend.disabled = loading;
      btnSend.disabled = loading || audioChunks.length === 0;
    }

    btnRecord.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => { if (e.data.size) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          setStatus('Stopped. Click Send.');
          btnRecord.disabled = false;
          btnStop.disabled = true;
          document.getElementById('btnSend').disabled = false;
        };

        mediaRecorder.start();
        btnRecord.classList.add('recording');
        btnRecord.disabled = true;
        btnStop.disabled = false;
        setStatus('Recording...');
      } catch (err) {
        setStatus('Mic denied');
      }
    });

    btnStop.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        btnRecord.classList.remove('recording');
      }
    });

    btnSend.addEventListener('click', async () => {
      if (audioChunks.length === 0) { setStatus('No recording'); return; }
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      setStatus('Transcribing...');
      setLoading(true);
      try {
        const fd = new FormData();
        fd.append('audio', blob);
        const r = await fetch('/api/transcribe', { method: 'POST', body: fd });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Transcription failed');
        const text = data.text || '';
        if (!text.trim()) { setStatus('No speech'); setLoading(false); return; }
        addToLog('user', text);
        setStatus('Sending...');
        await sendToAgent(text);
      } catch (err) {
        setStatus('Error: ' + err.message);
      } finally {
        setLoading(false);
        audioChunks = [];
        btnSend.disabled = true;
      }
    });

    async function sendToAgent(message) {
      setLoading(true);
      setStatus('Thinking...');

      const narrationDiv = document.createElement('div');
      narrationDiv.className = 'narration';
      messages.appendChild(narrationDiv);
      messages.scrollTop = messages.scrollHeight;

      function addNarrationLine(text) {
        const span = document.createElement('span');
        span.className = 'line';
        span.textContent = text;
        narrationDiv.appendChild(span);
        messages.scrollTop = messages.scrollHeight;
      }

      try {
        const fd = new FormData();
        fd.append('message', message);
        const r = await fetch('/api/chat', { method: 'POST', body: fd });
        if (!r.ok) {
          const errData = await r.json().catch(() => ({}));
          throw new Error(errData.error || 'Chat failed');
        }
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let finalResponse = '';

        function processEvent(line) {
          if (!line.startsWith('data: ')) return;
          try {
            const ev = JSON.parse(line.slice(6));
            if (ev.type === 'narrate') addNarrationLine(ev.text || '');
            else if (ev.type === 'response') finalResponse = ev.text || '';
            else if (ev.type === 'error') throw new Error(ev.text || 'Unknown error');
          } catch (e) {
            if (!(e instanceof SyntaxError)) throw e;
          }
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split('\n\n');
          buffer = events.pop() || '';
          for (const event of events) {
            const line = event.split('\n')[0];
            if (line) processEvent(line.trim());
          }
        }
        if (buffer.trim()) {
          const line = buffer.split('\n')[0];
          if (line) processEvent(line.trim());
        }

        narrationDiv.remove();
        addToLog('agent', finalResponse);
        setStatus('Ready');

        if (speakResponses && finalResponse) {
          setStatus('Speaking...');
          const s = await fetch('/api/speak', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'text=' + encodeURIComponent(finalResponse)
          });
          const sa = await s.json();
          if (sa.audio) {
            const audio = new Audio(sa.audio);
            await audio.play();
          }
          setStatus('Ready');
        }
      } catch (err) {
        narrationDiv.remove();
        setStatus('Error: ' + err.message);
        addToLog('agent', 'Sorry, something went wrong. ' + err.message);
      } finally {
        setLoading(false);
      }
    }

    btnTypeSend.addEventListener('click', () => {
      const msg = textInput.value.trim();
      if (!msg) return;
      textInput.value = '';
      addToLog('user', msg);
      sendToAgent(msg);
    });

    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnTypeSend.click();
    });

    const toolsToggle = document.getElementById('toolsToggle');
    const btnSuggestTools = document.getElementById('btnSuggestTools');
    const toolsPanel = document.getElementById('toolsPanel');
    const btnReloadTools = document.getElementById('btnReloadTools');

    toolsToggle.addEventListener('click', () => {
      toolsPanel.classList.toggle('open');
      memoryPanel.classList.remove('open');
      metricsPanel.classList.remove('open');
      if (toolsPanel.classList.contains('open')) loadToolQueue();
    });

    const memoryToggle = document.getElementById('memoryToggle');
    const memoryPanel = document.getElementById('memoryPanel');
    const metricsPanel = document.getElementById('metricsPanel');
    const memoryPanelClose = document.getElementById('memoryPanelClose');
    const memoryNodeModal = document.getElementById('memoryNodeModal');
    const memoryNodeModalTitle = document.getElementById('memoryNodeModalTitle');
    const memoryNodeModalContent = document.getElementById('memoryNodeModalContent');
    const memoryNodeModalClose = document.getElementById('memoryNodeModalClose');

    const metricsToggle = document.getElementById('metricsToggle');
    metricsToggle.addEventListener('click', () => {
      metricsPanel.classList.toggle('open');
      toolsPanel.classList.remove('open');
      memoryPanel.classList.remove('open');
      if (metricsPanel.classList.contains('open')) loadMetricsView();
    });

    memoryToggle.addEventListener('click', () => {
      memoryPanel.classList.toggle('open');
      toolsPanel.classList.remove('open');
      metricsPanel.classList.remove('open');
      if (memoryPanel.classList.contains('open')) loadMemoryView();
    });
    memoryPanelClose.addEventListener('click', () => memoryPanel.classList.remove('open'));
    memoryNodeModalClose.addEventListener('click', () => memoryNodeModal.classList.remove('open'));
    memoryNodeModal.addEventListener('click', (e) => { if (e.target === memoryNodeModal) memoryNodeModal.classList.remove('open'); });

    const settingsGear = document.getElementById('settingsGear');
    const settingsModal = document.getElementById('settingsModal');
    const settingsModalClose = document.getElementById('settingsModalClose');
    const voiceSelect = document.getElementById('voiceSelect');

    function apiUrl(path) {
      return new URL(path, window.location.origin + window.location.pathname).href;
    }
    async function loadSettingsModal() {
      voiceSelect.innerHTML = '<option value="">Loading...</option>';
      try {
        const voicesUrl = apiUrl('api/voices');
        const settingsUrl = apiUrl('api/settings');
        const [voicesRes, settingsRes] = await Promise.all([fetch(voicesUrl), fetch(settingsUrl)]);
        if (!voicesRes.ok) throw new Error('Voices: ' + voicesRes.status);
        if (!settingsRes.ok) throw new Error('Settings: ' + settingsRes.status);
        const voicesData = await voicesRes.json();
        const settings = await settingsRes.json();
        const current = settings.tts_voice || '';
        const voices = voicesData.voices || [];
        voiceSelect.innerHTML = voices.map(v =>
          `<option value="${v.id}" ${v.id === current ? 'selected' : ''}>${v.name || v.id} (${v.gender || ''})</option>`
        ).join('');
      } catch (e) {
        voiceSelect.innerHTML = '<option value="">Error: ' + (e.message || 'Failed to load') + '</option>';
      }
    }

    settingsGear.addEventListener('click', async () => {
      settingsModal.classList.add('open');
      await loadSettingsModal();
    });
    settingsModalClose.addEventListener('click', () => settingsModal.classList.remove('open'));
    settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.classList.remove('open'); });

    const btnSaveSettings = document.getElementById('btnSaveSettings');
    const settingsFeedback = document.getElementById('settingsFeedback');
    btnSaveSettings.addEventListener('click', async () => {
      const v = voiceSelect.value;
      if (!v) {
        settingsFeedback.textContent = 'Select a voice first';
        return;
      }
      settingsFeedback.textContent = '';
      try {
        const fd = new FormData();
        fd.append('tts_voice', v);
        const r = await fetch(apiUrl('api/settings'), { method: 'POST', body: fd });
        if (r.ok) {
          settingsFeedback.textContent = 'Saved.';
          setTimeout(() => { settingsFeedback.textContent = ''; }, 2000);
        } else {
          settingsFeedback.textContent = 'Save failed';
        }
      } catch (e) {
        settingsFeedback.textContent = 'Error: ' + (e.message || 'Save failed');
      }
    });

    async function loadMetricsView() {
      const el = document.getElementById('metricsContent');
      el.innerHTML = '<p style="color:#888">Loading...</p>';
      try {
        const r = await fetch('/api/memory-view');
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Failed to load');

        const bio = data.biology || {};
        const drives = bio.drives || {};
        const usage = data.image_usage || {};
        const subagents = typeof data.subagents === 'string' ? data.subagents : (data.subagents || '—');

        let html = '';
        html += '<h4>Drives</h4>';
        ['connection', 'curiosity', 'usefulness', 'expression'].forEach(d => {
          const v = (drives[d] ?? 0) * 100;
          const high = v >= 65;
          html += `<div class="metric-row"><label>${d}</label><div class="metric-bar-wrap"><div class="metric-bar ${high ? 'high' : ''}" style="width:${Math.min(100,v)}%"></div></div><span class="metric-value">${Math.round(v)}%</span></div>`;
        });
        const today = usage.today ?? 0;
        const limit = usage.limit ?? 20;
        const pct = limit ? Math.min(100, (today / limit) * 100) : 0;
        html += '<h4>Image usage (today)</h4>';
        html += `<div class="metric-row"><label>Generated</label><div class="metric-bar-wrap"><div class="metric-bar ${pct >= 80 ? 'high' : ''}" style="width:${pct}%"></div></div><span class="metric-value">${today}/${limit}</span></div>`;
        html += '<h4>Sub-agents</h4>';
        html += `<pre style="font-size:0.75rem;color:#a0c8ff;white-space:pre-wrap;margin:0">${escapeHtml(subagents)}</pre>`;
        el.innerHTML = html;
      } catch (err) {
        el.innerHTML = '<p style="color:#c66">Error: ' + escapeHtml(err.message) + '</p>';
      }
    }

    function cloudTag(title, content, size) {
      const s = size || 1;
      const bg = { 1: 'rgba(80,140,255,0.2)', 2: 'rgba(100,160,255,0.25)', 3: 'rgba(120,180,255,0.3)' }[s] || 'rgba(80,140,255,0.2)';
      const border = 'rgba(100,180,255,0.4)';
      const el = document.createElement('span');
      el.className = 'cloud-tag';
      el.textContent = content.length > 36 ? content.slice(0, 34) + '…' : content || '—';
      el.style.background = bg;
      el.style.borderColor = border;
      el.style.fontSize = (0.7 + s * 0.1) + 'rem';
      el.dataset.title = title;
      el.dataset.content = content;
      el.addEventListener('click', () => {
        memoryNodeModalTitle.textContent = title;
        memoryNodeModalContent.textContent = content;
        memoryNodeModal.classList.add('open');
      });
      return el;
    }

    async function loadMemoryView() {
      const container = document.getElementById('memoryGraphContainer');
      container.innerHTML = '<p style="color:#888;padding:2rem">Loading…</p>';
      try {
        const r = await fetch('/api/memory-view');
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Failed to load');

        container.innerHTML = '';

        // Adam-style profile panel — rich entries with health bars, source
        // badges, protect/forget controls, and an inline "remember" form.
        const entries = data.profile?.entries || [];
        const profileSection = document.createElement('div');
        profileSection.className = 'cloud-section';
        profileSection.innerHTML = '<h5>Profile memory</h5>';
        profileSection.appendChild(buildMemoryAdmin());
        const list = document.createElement('div');
        list.className = 'profile-fact-list';
        if (!entries.length) {
          list.innerHTML = '<div style="color:#666;padding:0.5rem">No profile facts yet. Share about yourself, or use the form above.</div>';
        }
        for (const e of entries) list.appendChild(buildFactRow(e));
        profileSection.appendChild(list);
        container.appendChild(profileSection);

        const epis = data.episodic || [];
        const memSection = document.createElement('div');
        memSection.className = 'cloud-section';
        memSection.innerHTML = '<h5>Memories</h5>';
        const memCloud = document.createElement('div');
        memCloud.className = 'tag-cloud';
        const recent = epis.slice(-50).reverse();
        recent.forEach((e, i) => {
          const c = e.content || '';
          memCloud.appendChild(cloudTag('Memory', c || '(empty)', i < 5 ? 2 : 1));
        });
        if (recent.length === 0) memCloud.appendChild(cloudTag('Memories', 'No episodic memories yet.', 1));
        memSection.appendChild(memCloud);
        container.appendChild(memSection);

        const work = data.working || {};
        const workKeys = Object.keys(work);
        const workSection = document.createElement('div');
        workSection.className = 'cloud-section';
        workSection.innerHTML = '<h5>Active task</h5>';
        const workCloud = document.createElement('div');
        workCloud.className = 'tag-cloud';
        workKeys.forEach(k => workCloud.appendChild(cloudTag('Task', k + ': ' + String(work[k]), 1)));
        if (workKeys.length === 0) workCloud.appendChild(cloudTag('Task', 'No active task state.', 1));
        workSection.appendChild(workCloud);
        container.appendChild(workSection);

        const thoughts = data.thoughts || [];
        const thSection = document.createElement('div');
        thSection.className = 'cloud-section';
        thSection.innerHTML = '<h5>Background thoughts</h5>';
        const thCloud = document.createElement('div');
        thCloud.className = 'tag-cloud';
        thoughts.slice(0, 25).forEach((t, i) => thCloud.appendChild(cloudTag('Thought', t.content || '', i < 3 ? 2 : 1)));
        if (thoughts.length === 0) thCloud.appendChild(cloudTag('Thoughts', 'No background thoughts yet.', 1));
        thSection.appendChild(thCloud);
        container.appendChild(thSection);

        const bio = data.biology || {};
        const drives = bio.drives || {};
        const driveSection = document.createElement('div');
        driveSection.className = 'cloud-section';
        driveSection.innerHTML = '<h5>Drives</h5>';
        const driveCloud = document.createElement('div');
        driveCloud.className = 'tag-cloud';
        ['connection', 'curiosity', 'usefulness', 'expression'].forEach(d => {
          const v = ((drives[d] ?? 0) * 100).toFixed(0);
          driveCloud.appendChild(cloudTag('Drive', d + ': ' + v + '%', (drives[d] ?? 0) >= 0.65 ? 2 : 1));
        });
        driveSection.appendChild(driveCloud);
        container.appendChild(driveSection);
      } catch (err) {
        container.innerHTML = '<p style="color:#c66;padding:2rem">Error: ' + escapeHtml(err.message) + '</p>';
      }
    }
    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // ---------- Memory admin (Adam-style profile panel) ----------

    function buildMemoryAdmin() {
      const wrap = document.createElement('div');
      wrap.className = 'memory-admin';
      wrap.innerHTML = `
        <div class="field">
          <label for="memCat">Category</label>
          <select id="memCat">
            <option value="personal">personal</option>
            <option value="work">work</option>
            <option value="background">background</option>
            <option value="preferences">preferences</option>
            <option value="other">other</option>
          </select>
        </div>
        <div class="field">
          <label for="memFact">Fact</label>
          <input id="memFact" type="text" placeholder="e.g. Lives in Alabama" />
        </div>
        <div class="full">
          <button onclick="memoryRemember()">Remember</button>
          <button onclick="loadMemoryView()" style="background:rgba(255,255,255,0.05);color:var(--text-secondary);border-color:rgba(255,255,255,0.12)">Refresh</button>
        </div>
      `;
      return wrap;
    }

    function buildFactRow(entry) {
      const row = document.createElement('div');
      row.className = 'profile-fact';
      const value = document.createElement('div');
      value.className = 'fact-value';
      value.textContent = entry.value;
      const actions = document.createElement('div');
      actions.className = 'fact-actions';
      const protectBtn = document.createElement('button');
      protectBtn.textContent = entry.protected ? 'Unprotect' : 'Protect';
      protectBtn.title = entry.protected ? 'Allow this fact to decay again' : 'Make this fact immortal';
      protectBtn.onclick = () => memoryProtect(entry.key, !entry.protected);
      const delBtn = document.createElement('button');
      delBtn.className = 'danger';
      delBtn.textContent = 'Forget';
      delBtn.onclick = () => memoryForget(entry.key, entry.value);
      actions.appendChild(protectBtn);
      actions.appendChild(delBtn);

      const meta = document.createElement('div');
      meta.className = 'fact-meta';
      const pct = Math.round((entry.confidence || 0) * 100);
      const ref = entry.last_referenced_at
        ? ('ref ' + new Date(entry.last_referenced_at).toLocaleString())
        : 'never used';
      const sourceClass = (entry.protected ? 'protected' : (entry.source || 'extracted'));
      meta.innerHTML = `
        <span class="health"><span style="width:${pct}%"></span></span>
        <span>${pct}%</span>
        <span class="badge ${sourceClass}">${entry.protected ? 'PROTECTED' : (entry.source || 'extracted')}</span>
        <span class="badge">${entry.category || 'general'}</span>
        <span>v${entry.version || 1}</span>
        <span>${ref}</span>
      `;
      row.appendChild(value);
      row.appendChild(actions);
      row.appendChild(meta);
      return row;
    }

    async function memoryRemember() {
      const cat = (document.getElementById('memCat')?.value || 'other').trim();
      const fact = (document.getElementById('memFact')?.value || '').trim();
      if (!fact) return;
      try {
        const fd = new FormData();
        fd.append('category', cat);
        fd.append('fact', fact);
        const r = await fetch('/api/memory/remember', { method: 'POST', body: fd });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'failed');
        document.getElementById('memFact').value = '';
        loadMemoryView();
      } catch (e) {
        alert('Could not remember: ' + e.message);
      }
    }

    async function memoryForget(key, value) {
      if (!confirm(`Forget this fact?\n\n"${value}"`)) return;
      try {
        const fd = new FormData();
        fd.append('key', key);
        const r = await fetch('/api/memory/forget', { method: 'POST', body: fd });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'failed');
        loadMemoryView();
      } catch (e) {
        alert('Could not forget: ' + e.message);
      }
    }

    async function memoryProtect(key, protect) {
      try {
        const fd = new FormData();
        fd.append('key', key);
        fd.append('protected', protect ? '1' : '0');
        const r = await fetch('/api/memory/protect', { method: 'POST', body: fd });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'failed');
        loadMemoryView();
      } catch (e) {
        alert('Could not toggle protection: ' + e.message);
      }
    }

    async function loadToolQueue() {
      try {
        const r = await fetch('/api/tool-queue');
        const q = await r.json();
        renderToolList('toolsSuggested', q.suggested || [], true);
        renderToolList('toolsApproved', q.approved || [], false);
        renderToolList('toolsImplemented', q.implemented || [], false, true);
      } catch (e) {
        document.getElementById('toolsSuggested').innerHTML = '<span style="color:#666">Load failed</span>';
      }
    }

    function renderToolList(id, items, showApprove, isImpl) {
      const el = document.getElementById(id);
      if (!items.length) {
        el.innerHTML = '<span style="color:#666">None</span>';
        return;
      }
      el.innerHTML = items.map(t => {
        const name = t.name || t.id || '?';
        const desc = (t.description || t.reason || '').slice(0, 50);
        if (isImpl) {
          return `<div class="tool-item"><span>${name}: ${desc}</span></div>`;
        }
        if (showApprove) {
          return `<div class="tool-item"><span>${name}: ${desc}</span><div class="tool-btns"><button onclick="approveTool('${t.id}')">Approve</button><button class="reject" onclick="rejectTool('${t.id}')">Reject</button></div></div>`;
        }
        return `<div class="tool-item"><span>${name}: ${desc}</span></div>`;
      }).join('');
    }

    window.approveTool = async (id) => {
      const fd = new FormData();
      fd.append('tool_id', id);
      await fetch('/api/tool-approve', { method: 'POST', body: fd });
      loadToolQueue();
    };

    window.rejectTool = async (id) => {
      const fd = new FormData();
      fd.append('tool_id', id);
      await fetch('/api/tool-reject', { method: 'POST', body: fd });
      loadToolQueue();
    };

    btnSuggestTools.addEventListener('click', () => {
      textInput.value = 'Analyze the codebase and suggest any new tools we might need. What gaps do we have?';
      textInput.focus();
    });

    const btnImplementTools = document.getElementById('btnImplementTools');
    btnImplementTools.addEventListener('click', () => {
      textInput.value = 'Implement all approved tools in the queue. Check get_tool_queue, then write each tool to src/tools/dynamic/ and call mark_tool_implemented for each.';
      textInput.focus();
    });

    btnReloadTools.addEventListener('click', async () => {
      await fetch('/api/tool-reload', { method: 'POST' });
      btnReloadTools.textContent = 'Reloaded';
      setTimeout(() => { btnReloadTools.textContent = 'Reload tools'; }, 1500);
    });
    const btnStopSubagents = document.getElementById('btnStopSubagents');
    btnStopSubagents.addEventListener('click', async () => {
      const r = await fetch('/api/subagents-stop-all', { method: 'POST' });
      const d = await r.json();
      btnStopSubagents.textContent = d.result || 'Done';
      setTimeout(() => { btnStopSubagents.textContent = 'Stop all sub-agents'; }, 2000);
    });

    // Notifications SSE: Discord messages, proactive outreach
    function showToast(ev) {
      const container = document.getElementById('notificationsToast');
      const div = document.createElement('div');
      div.className = 'toast ' + (ev.type || '');
      div.innerHTML = '<div class="toast-title">' + escapeHtml(ev.title || 'Notification') + '</div><div class="toast-body">' + escapeHtml(ev.body || '') + '</div>';
      container.appendChild(div);
      setTimeout(() => div.remove(), 8000);
    }
    (function connectNotifications() {
      const es = new EventSource('/api/notifications/stream');
      es.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (d.type === 'ping') return;
          showToast(d);
          try {
            if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && d.type === 'discord_message')
              new Notification(d.title || 'Discord', { body: (d.body || '').slice(0, 200) });
          } catch (_) {}
        } catch (_) {}
      };
      es.onerror = () => { es.close(); setTimeout(connectNotifications, 5000); };
      try { if (typeof Notification !== 'undefined' && Notification.permission === 'default') Notification.requestPermission(); } catch (_) {}
    })();
  </script>
</body>
</html>
